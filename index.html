<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fayçal El Joudi · Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2f6;--fg:#10222c;--dim:#52707e;--acc:#0077a8;--line:#b7cdd8;--glow:none;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b14;--fg:#c9e6f2;--dim:#5f8397;--acc:#3df0ff;--line:#12384a;--glow:0 0 8px rgba(61,240,255,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050b14;--fg:#c9e6f2;--dim:#5f8397;--acc:#3df0ff;--line:#12384a;--glow:0 0 8px rgba(61,240,255,.55);color-scheme:dark}
:root[data-theme="matrix"]{--bg:#060d08;--fg:#9be8a8;--dim:#4d8a5a;--acc:#5dff7e;--line:#12301a;--glow:0 0 8px rgba(93,255,126,.5);color-scheme:dark}
body{margin:0;height:100%;display:flex;flex-direction:column;color:var(--fg);font:15px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.14) 2px 3px)}
#hud{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 24px);max-width:780px;margin:12px auto 8px;font:600 12px "Orbitron","JetBrains Mono",sans-serif;letter-spacing:.18em;color:var(--acc);text-shadow:var(--glow)}
#hud i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:var(--glow);margin-right:8px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@media (prefers-reduced-motion:reduce){#hud i{animation:none}}
#term{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 28px;width:calc(100% - 24px);max-width:780px;margin:0 auto 14px;cursor:text;border:1px solid var(--line);border-top:2px solid var(--acc);background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:inset 0 0 40px color-mix(in srgb,var(--acc) 8%,transparent);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
#out div{white-space:pre-wrap;word-break:break-word;margin:0 0 2px}
.dim{color:var(--dim)} .acc{color:var(--acc);font-weight:700;text-shadow:var(--glow)}
a{color:var(--acc)}
.ph{display:block;width:170px;max-width:55%;height:auto;margin:8px 0 12px;border:1px solid var(--acc);box-shadow:var(--glow);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.sch{display:block;width:100%;max-width:340px;height:auto;margin:8px 0 12px}
.s-f{fill:color-mix(in srgb,var(--acc) 10%,transparent);stroke:var(--acc);stroke-width:1.3}
.s-l{fill:none;stroke:var(--acc);stroke-width:1.3}
.s-g{fill:none;stroke:var(--line);stroke-width:1}
.s-dash{stroke-dasharray:4 3}
.s-t{fill:var(--fg);font:11px "JetBrains Mono",ui-monospace,monospace}
.s-d{fill:var(--dim);font:10px "JetBrains Mono",ui-monospace,monospace}
.row{display:flex;gap:.6em;align-items:center;margin-top:6px}
.pl{color:var(--acc);font-weight:700;white-space:nowrap;text-shadow:var(--glow)}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:16px;caret-color:var(--acc);padding:4px 0}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#chips button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:0;padding:6px 12px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#chips button:hover,#chips button:focus-visible{border-color:var(--acc);color:var(--acc);outline:0;box-shadow:var(--glow)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header id="hud"><span>SYS//PORTFOLIO</span><span><i></i>EN LIGNE</span></header>
<main id="term" aria-label="Terminal du portfolio">
  <div id="out" aria-live="polite"></div>
  <label class="row" for="in"><span class="pl" id="pl">visiteur@faycal:~$</span><input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" disabled></label>
  <div id="chips"></div>
</main>

    cx.clearRect(0,0,W,H);var c=getComputedStyle(root).getPropertyValue('--acc').trim();cx.fillStyle=c;cx.strokeStyle=c;

      if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      cx.globalAlpha=.7;cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.283);cx.fill();

    if(!reduce)requestAnimationFrame(draw)
  }
  size();draw();addEventListener('resize',function(){size();if(reduce)draw()});

  var NOM='Fayçal El Joudi';
  var PROJETS={
    'escape-game':{d:'SAE de gestion : en groupe de 5, création du synopsis d’un escape game informatique où il faut réparer une IA en corrigeant du code. Ensuite, conception du site et des flyers pour le synopsis d’un autre groupe.',stack:'Gestion de projet, travail en équipe, conception web'},
    'systeme':{d:'SAE système : installation de Linux en dual boot et d’une machine virtuelle Ubuntu sur la même machine.',stack:'Linux, Ubuntu, machine virtuelle, dual boot'},
    'rubiks-cube':{d:'SAE développement : un Rubik’s cube capable de se résoudre tout seul, programmé en Java.',stack:'Java, développement'}
  };
  var SKILLS=['Apprentissage très rapide','Concentration quand le sujet me passionne','Écoute active','Travail en équipe','Java (que je commence à bien maîtriser)','Linux / Ubuntu (dual boot, VM)','Git / GitLab'];
  var CONTACT={mail:'faycaleljoudi@gmail.com',etu:'faycal.el-joudi@etu.umontpellier.fr',gl:'https://gitlabinfo.iutmontp.univ-montp2.fr/eljoudif',in:'https://www.linkedin.com/in/fay%C3%A7al-el-joudi-160233439'};

  function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function line(html,cls){var d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;out.appendChild(d);term.scrollTop=term.scrollHeight;return d}
  function wait(ms){return new Promise(function(r){setTimeout(r,reduce?0:ms)})}

  var LEVELS=[['Java',6],['Linux',5],['HTML/CSS',4],['Git',5],['Cyber',3],['Équipe',7],['Apprentissage',9]];
  function flow(items){
    var h=items.length*58-20,s='<svg class="sch" viewBox="0 0 300 '+h+'" role="img" aria-label="Schéma du projet">';
    items.forEach(function(t,i){var y=i*58;
      s+='<rect class="s-f" x="10" y="'+y+'" width="280" height="38"/><text class="s-t" x="150" y="'+(y+24)+'" text-anchor="middle">'+t+'</text>';
      if(i<items.length-1)s+='<path class="s-l" d="M150 '+(y+38)+'V'+(y+58)+'M145 '+(y+52)+'L150 '+(y+58)+'L155 '+(y+52)+'"/>';
    });
    return s+'</svg>';
  }
  function radar(data){
    var n=data.length,cx=150,cy=130,R=72,pts=[],s='<svg class="sch" viewBox="-20 0 340 250" role="img" aria-label="Radar des compétences">';
    [.25,.5,.75,1].forEach(function(k){var g=[];for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n;g.push((cx+R*k*Math.cos(a)).toFixed(1)+','+(cy+R*k*Math.sin(a)).toFixed(1))}s+='<polygon class="s-g" points="'+g.join(' ')+'"/>'});
    data.forEach(function(d,i){
      var a=-Math.PI/2+i*2*Math.PI/n,c=Math.cos(a),sn=Math.sin(a),r=d[1]/10;
      s+='<line class="s-g" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*c).toFixed(1)+'" y2="'+(cy+R*sn).toFixed(1)+'"/>';
      pts.push((cx+R*r*c).toFixed(1)+','+(cy+R*r*sn).toFixed(1));
      s+='<text class="s-t" x="'+(cx+(R+14)*c).toFixed(1)+'" y="'+(cy+(R+14)*sn+4).toFixed(1)+'" text-anchor="'+(c>.3?'start':c<-.3?'end':'middle')+'">'+d[0]+'</text>';
    });
    return s+'<polygon class="s-f" points="'+pts.join(' ')+'"/></svg>';
  }
  var SCH={
    'escape-game':function(){return flow(['1. Synopsis de notre escape game','2. Synopsis reçu d’un autre groupe','3. Échanges : leur vision des salles','4. Conception de leur site et flyers'])},
    'rubiks-cube':function(){return flow(['Cube mélangé','Modèle du cube en Java','Algorithme de résolution','Cube résolu'])},
    'systeme':function(){return '<svg class="sch" viewBox="0 0 300 180" role="img" aria-label="Schéma dual boot et machine virtuelle"><rect class="s-l s-dash" x="4" y="4" width="292" height="172"/><text class="s-d" x="14" y="22">Une seule machine</text><rect class="s-f" x="14" y="32" width="136" height="42"/><text class="s-t" x="82" y="57" text-anchor="middle">Système d’origine</text><rect class="s-f" x="150" y="32" width="136" height="42"/><text class="s-t" x="218" y="57" text-anchor="middle">Ubuntu (Linux)</text><text class="s-d" x="150" y="92" text-anchor="middle">Dual boot : un seul système à la fois</text><rect class="s-f s-dash" x="40" y="108" width="220" height="52"/><text class="s-t" x="150" y="130" text-anchor="middle">VM Ubuntu</text><text class="s-d" x="150" y="148" text-anchor="middle">dans le système lancé</text></svg>'}
  };
  var CMDS={
    help:function(){
      line('Commandes disponibles :');
      [['about','qui je suis'],['projects','mes projets'],['open &lt;projet&gt;','le détail d’un projet'],['skills','mes compétences'],['contact','me joindre'],['theme &lt;nom&gt;','dark, light ou matrix'],['clear','vider l’écran']].forEach(function(c){
        line('  <span class="acc">'+c[0]+'</span> <span class="dim">— '+c[1]+'</span>');
      });
      line('Astuce : Tab complète, ↑ rappelle la commande précédente.','dim');
    },
    about:function(){
      line('<img class="ph" alt="Portrait de Fayçal" src="'+PHOTO+'">');
      line('<span class="acc">'+NOM+'</span>, 18 ans, étudiant en 1re année de BUT Informatique à l’IUT de Montpellier-Sète.');
      line('Venu d’une filière maths-physique-chimie, je ne connaissais l’informatique que vaguement. Depuis le BUT, je m’y plonge à fond.');
      line('Je cherche une <span class="acc">alternance</span> en développement ou en cybersécurité pour ma 2e et ma 3e année.');
      line('Je comprends vite, j’écoute, et quand un sujet me plaît je ne lâche pas. Hors écran : jiu-jitsu brésilien.','dim');
    },
    projects:function(){
      line('Projets (tape <span class="acc">open nom-du-projet</span>) :');
      Object.keys(PROJETS).forEach(function(k){line('  <span class="acc">'+k+'</span> <span class="dim">— '+PROJETS[k].stack+'</span>')});
    },
    open:function(a){
      var k=a[0],p=PROJETS[k];
      if(!k){line('Il manque le nom du projet. Essaie : open projet-un');return}
      if(!p){line('Projet « '+esc(k)+' » introuvable. Tape <span class="acc">projects</span> pour voir la liste.');return}
      line('<span class="acc">'+k+'</span>');
      line(p.d);
      line('Mots-clés : '+p.stack,'dim');
      if(SCH[k])line(SCH[k]());
      if(p.l)line('Code : <a href="'+p.l+'" target="_blank" rel="noopener">'+p.l+'</a>');
    },
    skills:function(){line(radar(LEVELS));SKILLS.forEach(function(s){line('  <span class="acc">+</span> '+s)})},
    contact:function(){
      line('Mail     : <a href="mailto:'+CONTACT.mail+'">'+CONTACT.mail+'</a>');
      line('Mail étu : <a href="mailto:'+CONTACT.etu+'">'+CONTACT.etu+'</a>');
      line('GitLab   : <a href="'+CONTACT.gl+'" target="_blank" rel="noopener">eljoudif</a>');
      line('LinkedIn : <a href="'+CONTACT.in+'" target="_blank" rel="noopener">Fayçal El Joudi</a>');
    },
    theme:function(a){
      var t=a[0];
      if(['dark','light','matrix'].indexOf(t)<0){line('Thèmes : dark, light, matrix. Exemple : theme matrix');return}
      root.setAttribute('data-theme',t);line('Thème « '+t+' » activé.');
    },
    clear:function(){out.innerHTML=''},
    sudo:function(a){
      if(a.join(' ')==='hire-me'){line('[sudo] autorisation accordée.','acc');line('Recrutement en cours… envoie-moi un mail via <span class="acc">contact</span>.')}
      else line('Permission refusée.');
    }
  };
  var NAMES=Object.keys(CMDS);

  var hist=[],hi=0;
  function run(raw){
    var txt=raw.trim();
    line('<span class="pl">visiteur@faycal:~$</span> '+esc(txt));
    if(!txt)return;
    hist.push(txt);hi=hist.length;
    var p=txt.split(/\s+/),c=p[0].toLowerCase();
    if(CMDS[c])CMDS[c](p.slice(1));
    else line('Commande inconnue : '+esc(c)+'. Tape <span class="acc">help</span>.');
  }

  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var v=inp.value;inp.value='';run(v)}
    else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}}
    else if(e.key==='ArrowDown'){e.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}}
    else if(e.key==='Tab'){
      e.preventDefault();
      var v=inp.value,m=v.match(/^open\s+(\S*)$/i);
      var pool=m?Object.keys(PROJETS):NAMES,start=m?m[1]:v,hits=pool.filter(function(n){return n.indexOf(start.toLowerCase())===0});
      if(hits.length===1)inp.value=m?'open '+hits[0]:hits[0];
    }
  });
  term.addEventListener('click',function(){if(!window.getSelection().toString())inp.focus()});

  ['about','projects','skills','contact','help'].forEach(function(c){
    var b=document.createElement('button');b.type='button';b.textContent=c;
    b.addEventListener('click',function(){run(c);inp.focus()});chips.appendChild(b);
  });

  (async function boot(){
    var L=['Initialisation du noyau…','Synchronisation des projets… [OK]','Calibrage des compétences… [OK]','Liaison sécurisée établie.'];
    for(var i=0;i<L.length;i++){line(L[i],'dim');await wait(380)}
    line('');line('Accès autorisé — profil actif : <span class="acc">'+NOM+'</span>.');
    line('Tape <span class="acc">help</span> pour voir les commandes, ou touche un bouton ci-dessous.');
    inp.disabled=false;
    if(!/Mobi|Android/i.test(navigator.userAgent))inp.focus();
  })();
})();
